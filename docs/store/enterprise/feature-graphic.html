<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
body{width:1024px;height:500px;overflow:hidden;background:#0b1220;font-family:"DejaVu Sans",sans-serif;position:relative;color:#e8edf5}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(242,184,75,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(242,184,75,.05) 1px,transparent 1px);background-size:32px 32px}
.glow{position:absolute;right:120px;top:40px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(242,184,75,.13),transparent 65%)}
.left{position:absolute;left:60px;top:84px}
.brand{display:flex;align-items:center;gap:18px}
.brand svg{width:70px;height:70px}
h1{margin:0;font-size:58px;line-height:1.05;font-weight:700}
h1 .a{color:#F2B84B;display:block}
.lines{margin-top:26px;font-size:24px;line-height:1.6;color:#9fb0c8}
.bar{margin-top:22px;width:240px;height:3px;background:#F2B84B}
.phone{position:absolute;right:70px;top:46px;width:330px;height:408px;border-radius:30px;background:#111a2b;border:1px solid #26344d;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.ph{padding:26px 24px}
.org{font-size:14px;color:#9fb0c8;letter-spacing:.06em}
.q{margin-top:10px;font-size:24px;font-weight:700}
.sub{margin-top:8px;font-size:15px;color:#9fb0c8}
.nums{display:flex;gap:12px;margin-top:26px}
.n{flex:1;height:78px;border-radius:16px;border:1px solid #2c3b57;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#cfd8e6;background:#0d1524}
.n.on{border:2px solid #F2B84B;color:#0b1220;background:#F2B84B}
.timer{margin-top:22px;height:6px;border-radius:3px;background:#22304a;overflow:hidden}
.timer i{display:block;width:62%;height:100%;background:#F2B84B}
.no{margin-top:26px;height:48px;border-radius:12px;border:1px solid #3a4a66;display:flex;align-items:center;justify-content:center;font-size:17px;color:#cfd8e6}
.ok{margin-top:16px;text-align:center;font-size:14px;color:#7f90aa}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="left">
 <div class="brand">
  <svg viewBox="30 28 48 52"><path fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" d="M57.49,29.85 L44.17,47.27 L57.03,61.07 L45.07,76.71 A24.4,24.4 0 0 1 57.49,29.85 Z"/><path fill="#F2B84B" stroke="#F2B84B" stroke-width="1.2" stroke-linejoin="round" d="M62.93,31.29 L50.97,46.93 L63.83,60.73 L50.51,78.15 A24.4,24.4 0 0 0 62.93,31.29 Z"/></svg>
  <h1>Veilo<span class="a">Enterprise</span></h1>
 </div>
 <div class="lines">Telefonda sayı eşleştirmeli onay<br>Anahtar güvenli donanımda<br>Kendi sunucunuz, bulut yok</div>
 <div class="bar"></div>
</div>
<div class="phone"><div class="ph">
 <div class="org">DENEME AŞ · VPN</div>
 <div class="q">Oturum açan siz misiniz?</div>
 <div class="sub">Ekrandaki sayıyı seçin</div>
 <div class="nums"><div class="n">17</div><div class="n on">83</div><div class="n">46</div></div>
 <div class="timer"><i></i></div>
 <div class="no">Ben değilim</div>
 <div class="ok">Yanıt cihaz anahtarıyla imzalanır</div>
</div></div>
</body></html>
